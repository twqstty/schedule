<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Расписание</title>

  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="background"></div>

  <div class="card">
    <h2 id="title">📅 Моё расписание</h2>
    <p id="week"><span id="typed"></span><span class="cursor">▍</span></p>

    <button onclick="prevWeek()">⬅️ Предыдущая неделя</button>
    <button onclick="nextWeek()">Следующая неделя ➡️</button>
    <button class="secondary" onclick="openSchedule()">Открыть расписание</button>
  </div>

<script src="script.js"></script>
</body>
</html>
